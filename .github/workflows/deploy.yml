name: Deploy site and refresh wait times

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's recommended Pages layout). When both ran in one job,
  # deploy-pages sometimes asked for the artifact a moment after upload and was told it did not exist yet
  # ("No artifacts named github-pages were found"), failing about one scheduled run in ten.
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir _site
          cp index.html manifest.webmanifest icon.svg sw.js _site/
          touch _site/.nojekyll
      # Pages has to be switched on once in the repository settings (Settings > Pages > Source: GitHub Actions).
      # Until then this job ends quietly with a notice, so the schedule does not send a failure email every 30 minutes.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Fetch current wait times from Queue-Times
        run: |
          if curl -fsS --max-time 30 --retry 2 -o _site/waits.json https://queue-times.com/parks/16/queue_times.json; then
            echo "Fetched $(wc -c < _site/waits.json) bytes"
          else
            echo "::warning::Could not fetch wait times; the page falls back to its built-in snapshot"
            rm -f _site/waits.json
          fi
      - name: Extend the rolling wait history
        if: steps.pages.outcome == 'success'
        run: |
          # yesterday's samples live on the deployed site, so the history needs no commits
          curl -fsS --max-time 20 -o prev-history.json "${{ steps.pages.outputs.base_url }}/history.json" || echo '{"samples":[]}' > prev-history.json
          node scripts/history.mjs _site/waits.json prev-history.json _site/history.json
      - if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is not enabled for this repository yet, so nothing was deployed."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # one retry after a short wait covers a brief Pages or artifact API hiccup
      - if: steps.deployment.outcome != 'success'
        run: sleep 30
      - if: steps.deployment.outcome != 'success'
        id: retry
        uses: actions/deploy-pages@v4
