name: Deploy site and refresh wait times

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
      - name: Fetch current wait times from Queue-Times
        run: |
          if curl -fsS --max-time 30 -o _site/waits.json https://queue-times.com/parks/16/queue_times.json; then
            echo "Fetched $(wc -c < _site/waits.json) bytes"
          else
            echo "::warning::Could not fetch wait times; the page falls back to its built-in snapshot"
            rm -f _site/waits.json
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
